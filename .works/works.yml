company_name: Awesome Managed Databases
content_table: true
item_name: Item
items_name: Items
paging_mode: paging
copyright_year: 2026
name: Awesome Managed Databases
initial_prompt: |-
  A curated directory of serverless and managed database services: Postgres, MySQL, distributed SQL, SQLite-at-the-edge and NoSQL. Include products such as Neon, Supabase, PlanetScale, Turso, CockroachDB Cloud, Aiven, Xata, Nile, Prisma Postgres, MongoDB Atlas, TiDB Cloud, Upstash, plus other notable commercial and open-source options. Categories: Serverless Postgres, Managed MySQL, Distributed SQL, Edge / SQLite Databases, NoSQL DBaaS, Free Tiers. For every item capture the official website, a short factual description, pricing model (free, freemium, paid, open source), deployment (cloud or self-hosted), key features and integrations.

  Initial categories: Serverless Postgres; Managed MySQL; Distributed SQL; Edge / SQLite Databases; NoSQL DBaaS; Free Tiers.
  Target keywords: serverless database, managed postgres, dbaas, database hosting.

  Start with these source lists (use the raw README link for GitHub lists):
  - https://github.com/ripienaar/free-for-dev#managed-data-services
  - https://raw.githubusercontent.com/alexeyfv/awesome-free-postgres/HEAD/README.md
  - https://openalternative.co/categories/infrastructure-operations/databases
  - https://github.com/topics/dbaas
  - https://github.com/topics/serverless-database

  Inclusion rules: every item is a real product, service, open-source project or platform in scope; never a statistic, quote, blog post, person or general concept.
  One item per product. The item URL is the official website (never an affiliate link, review-site page or "top 10" article). Skip discontinued products and sites that no longer resolve.
  Descriptions: 2-4 factual sentences, no hype; state the pricing model; for open source state the license and link the repository.
  Each item gets exactly one primary category from the initial categories; do not create near-duplicate categories.
  Tags where they apply: Open Source, Self-Hosted, Free Plan, Freemium, Paid, Enterprise, API, AI-Powered, plus niche-specific ones.
  Never use G2, Capterra, GetApp, TrustRadius, AlternativeTo, Product Hunt, SourceForge/Slashdot, There's An AI For That or Toolify as sources.
