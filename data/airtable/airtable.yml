markdown: >-
  ## Overview


  Airtable looks like a spreadsheet but functions as a relational database,
  offered as a cloud database service.


  ## Features


  - Unlimited bases

  - Relational database capabilities

  - Spreadsheet-like interface

  - API access


  ## Pricing


  Free tier includes:

  - Unlimited bases

  - 1,200 rows per base

  - 1,000 API requests per month
