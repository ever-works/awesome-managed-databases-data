name: Activepieces
description: Backend automation platform that lets you build flows to connect
  several apps together in your app's backend, such as sending a Slack message
  or adding a Google Sheet row when an event fires. Free tier allows up to 5,000
  tasks per month. Self-hosted open-source option available under MIT license.
source_url: https://activepieces.com/
