markdown: >-
  ## Overview


  BackupDrill is a backup and restore drill service for Supabase projects.


  ## Features


  - Backs up Supabase projects to S3, R2, or B2 buckets

  - Scheduled restore drills to prove backups restore

  - Weekly backups on free plan

  - One restore drill on first backup


  ## Pricing


  Free plan includes weekly backups for one project and one restore drill on
  your first backup.
