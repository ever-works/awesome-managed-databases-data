markdown: >-
  ## Overview


  ConnectyCube is a BaaS platform focused on real-time communication features
  including chat, voice and video calls, file attachments, and push
  notifications for mobile and web applications.


  ## Features


  - Unlimited chat messages

  - P2P voice & video calls

  - File attachments

  - Push notifications

  - Free for apps up to 1000 users


  ## Pricing


  Free tier available for apps with up to 1000 users. Paid plans for larger
  applications.
