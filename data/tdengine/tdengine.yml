markdown: >-
  ## Overview


  TDengine is a high-performance time-series database and historian built for
  industrial data and IoT workloads.


  ## Features


  - High-performance time-series database with industrial data management

  - Built-in stream analytics

  - AI-driven anomaly detection

  - Purpose-built for operational environments

  - High compression and efficient storage


  ## Pricing


  Open source under the AGPL-3.0 license. Commercial and cloud options
  available.
