markdown: >-
  ## Overview


  Searchly is a managed search service that provides indexed search capabilities
  as a hosted NoSQL database. It handles search index infrastructure so users do
  not need to manage their own search servers.


  ## Features


  - Managed search indices

  - 2 indices and 20 MB storage on the free plan

  - Hosted search platform

  - Search indexing and querying


  ## Pricing


  A free plan is available with 2 indices and 20 MB storage. Paid plans scale
  beyond the free tier limits.
