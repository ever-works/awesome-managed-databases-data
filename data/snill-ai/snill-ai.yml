markdown: >-
  ## Overview


  Snill AI is an AI-powered no-code platform that generates complete business
  systems from plain-language descriptions, including relational databases,
  dashboards, workflows, REST APIs, and webhooks.


  ## Features


  - Natural language to business system generation

  - Relational database

  - Dashboards

  - Workflows

  - REST API

  - Webhooks

  - Free plan: 2 apps, 1,000 records, 10 AI requests/day


  ## Pricing


  Free plan for solo operators includes 2 apps, 1,000 records, and 10 AI
  requests per day. Paid plans for teams and higher usage.
