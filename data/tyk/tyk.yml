markdown: >-
  ## Overview


  Tyk is an open-source API management platform providing API gateway,
  authentication, quotas, monitoring, and analytics for managing APIs at scale.


  ## Features


  - API gateway

  - Authentication and authorization

  - Rate limiting and quotas

  - Monitoring and analytics

  - Free cloud offering

  - Open source


  ## Pricing


  Free cloud tier available. Self-hosted open-source version available under
  AGPL license. Paid plans for enterprise features.
