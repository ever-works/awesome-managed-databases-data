markdown: >-
  ## Overview


  IBM Db2 is a managed relational database service provided by IBM Cloud. It
  offers a free tier with 100MB of data storage as part of IBM Cloud's free tier
  offerings.


  ## Features


  - Managed relational database service

  - 100MB data storage on free tier

  - Part of IBM Cloud


  ## Pricing


  Freemium model. Free tier includes 100MB of data storage. Paid tiers available
  beyond free tier limits.


  ## Deployment


  Cloud (IBM Cloud)
