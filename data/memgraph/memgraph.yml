markdown: >-
  ## Overview


  Memgraph is an in-memory graph database solution designed for real-time graph
  analytics and high-performance graph computing.


  ## Features


  - Scalable, in-memory graph database

  - High-performance computing

  - Neo4j compatibility (openCypher)

  - Real-time graph analytics

  - ACID transactions


  ## Pricing


  Open source. Commercial options available.
