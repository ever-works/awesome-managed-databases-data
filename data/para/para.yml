markdown: >-
  ## Overview


  Para is a backend service API providing flexible authentication, full-text
  search, and caching for applications.


  ## Features


  - Flexible authentication

  - Full-text search

  - Caching

  - Object storage

  - Free for one app

  - 1GB of app data (free)


  ## Pricing


  Free tier for one app with 1GB of app data. Paid plans for multiple apps and
  higher limits.
