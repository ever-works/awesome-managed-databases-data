markdown: >-
  ## Overview


  Simperium is a data synchronization service that moves structured data
  instantly and automatically across multiple platforms and devices.


  ## Features


  - Unlimited sending and storage of structured data

  - Multi-platform synchronization

  - Max 2,500 users/month on free tier

  - Real-time data sync


  ## Pricing


  Free tier supports up to 2,500 users/month. Paid plans for larger scale.
