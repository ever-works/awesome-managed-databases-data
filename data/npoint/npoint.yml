markdown: >-
  ## Overview


  Npoint is a JSON store with collaborative schema editing, letting teams store
  and manage JSON documents together through an API.


  ## Features


  - JSON document storage

  - Collaborative schema editing

  - API-driven data access

  - Suitable for small apps and prototypes


  ## Pricing


  Free tier available.
