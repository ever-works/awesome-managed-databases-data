markdown: >-
  ## Overview


  Filess.io offers a free-tier PostgreSQL database service ideal for hobby
  projects and experiments.


  ## Core Specifications


  | Specification | Value |

  |---|---|

  | Storage | 2 × 10 MB |

  | CPU | N/A |

  | RAM | N/A |

  | Backups | Weekly backups |


  ## Limits


  | Limit | Value |

  |---|---|

  | Network | Not specified |

  | Other Limits | Not specified |

  | Pause Policy | No pause |


  ## Registration


  - Email

  - Google


  ## Locations


  US, Europe, Asia. Region is automatically selected based on user location with
  no manual override.


  ## Pricing Model


  Free tier available with no credit card required.
