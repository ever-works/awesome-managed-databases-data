markdown: >-
  ## Overview


  Backendless is a Mobile and Web Backend-as-a-Service platform that provides
  database, user management, file storage, and push notifications for mobile and
  web applications.


  ## Features


  - 1 GB file storage free

  - Push notifications: 50,000/month free

  - 1000 data objects free in tables

  - User management and authentication

  - File storage

  - Real-time database


  ## Pricing


  Freemium model with a free tier including 1 GB file storage, 50,000 push
  notifications/month, and 1000 data objects. Paid plans available for higher
  limits.
