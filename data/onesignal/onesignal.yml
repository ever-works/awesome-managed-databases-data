markdown: >-
  ## Overview


  OneSignal is a customer engagement platform providing push notifications,
  email, SMS, and in-app messaging for mobile and web applications.


  ## Features


  - Unlimited free push notifications

  - 10,000 email sends per month

  - Unlimited contacts

  - Auto Warm Up for email deliverability

  - In-app messaging

  - SMS


  ## Pricing


  Free tier includes unlimited push notifications and 10,000 email sends/month.
  Paid plans for higher volumes and advanced features.
