markdown: >-
  ## Overview


  Zapier is an automation platform that connects web applications and services
  to automate workflows without code.


  ## Features


  - Connect thousands of apps

  - Multi-step workflows (zaps)

  - Webhooks

  - Five zaps every 15 minutes (free)

  - 100 tasks/month (free)

  - Five active automations (free)


  ## Pricing


  Free plan includes five zaps every 15 minutes, 100 tasks/month, and five
  active automations. Paid plans for higher task volumes and premium apps.
