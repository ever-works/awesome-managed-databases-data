markdown: >-
  ## Overview


  IFTTT (If This Then That) is an automation platform that connects web
  services, apps, and devices through conditional applets.


  ## Features


  - Connect apps and devices

  - Create conditional applets

  - Free tier includes 2 Applets

  - Wide service integrations


  ## Pricing


  Free plan includes 2 Applets. Paid plans for unlimited applets and advanced
  features.
