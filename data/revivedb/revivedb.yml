markdown: |-
  ## Overview

  ReviveDB is a recovery point service for Supabase applications.

  ## Features

  - Recovery points for database, Auth, Storage files, Edge Functions
  - Supported project configuration backup
  - Backup verified only after restore and comparison
  - Weekly backups on free plan
  - Three recovery points on free plan

  ## Pricing

  Free plan covers one project with weekly backups and three recovery points.
