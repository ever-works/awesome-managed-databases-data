markdown: |-
  ## Overview

  Tinybird is a serverless managed ClickHouse database service.

  ## Features

  - Serverless managed ClickHouse
  - Connection-less data ingest over HTTP
  - Publish SQL queries as managed HTTP APIs
  - No time limit on free tier

  ## Pricing

  Free tier has no time limit, with 10GB storage and 1,000 API requests per day.
