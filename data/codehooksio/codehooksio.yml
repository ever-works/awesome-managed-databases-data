  - Serverless functions

  - MongoDB-ish queries

  - Key/value lookups

  - Job system

  - Realtime messages

  - Worker queues

  - CLI

  - Web-based data manager


  ## Pricing


  Free plan includes:

  - 5GB storage

  - 60 API calls per minute

  - 2 developers included

  - No credit card required
