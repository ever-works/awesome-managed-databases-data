markdown: >-
  ## Overview


  FlutterFlow is a low-code visual development platform for building Flutter
  mobile and web applications, with built-in Firebase integration for backend
  services.


  ## Features


  - Visual UI builder for Flutter apps

  - Firebase integration

  - Full access to UI Builder on free plan

  - Free templates included

  - No-code app development


  ## Pricing


  Free plan includes full UI Builder access and free templates. Paid plans for
  code export, deployment, and advanced features.
