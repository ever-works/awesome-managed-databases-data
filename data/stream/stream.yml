markdown: >-
  ## Overview


  Stream provides backend APIs and SDKs for adding In-App Chat, Messaging,
  Video, Audio, and Activity Feeds to web and mobile applications.


  ## Features


  - Scalable In-App Chat and Messaging

  - Video and audio calling

  - Activity Feeds

  - SDKs for multiple platforms

  - Enterprise-grade infrastructure


  ## Pricing


  Contact for pricing. Free tier available for getting started.
