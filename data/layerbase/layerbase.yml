name: Layerbase
description: Layerbase offers free-tier PostgreSQL as a Service with 5 GB
  storage, 0.5 CPU, and 0.5 GB RAM. It includes 1 manual backup slot, supports 2
  databases total, and features 7 other database engines besides PostgreSQL
  (MariaDB, SQLite, DuckDB, libSQL, Redis, Valkey, TypeDB). Databases sleep
  after 60 minutes idle and wake automatically on connect.
source_url: https://layerbase.com
category: Serverless Postgres
tags:
  - Free Plan
  - Freemium
  - Multi-Engine
markdown: >-
  ## Overview


  Layerbase provides a free-tier multi-engine database service including
  PostgreSQL as one of 7 supported database engines.


  ## Core Specifications


  | Specification | Value |

  |---|---|

  | Storage | 5 GB |

  | CPU | 0.5 |

  | RAM | 0.5 GB |

  | Backups | 1 manual backup slot |


  ## Limits


  | Limit | Value |

  |---|---|

  | Network | N/A |

  | Other Limits | 2 databases total |

  | Pause Policy | Sleeps after 60 min idle, wakes automatically on connect in
  ~1-5 s. Archived after 14 days asleep; restorable from dashboard. |


  ## Registration


  - GitHub

  - Google


  ## Locations


  US


  ## Supported Database Engines


  PostgreSQL, MariaDB, SQLite, DuckDB, libSQL, Redis, Valkey, TypeDB


  ## Pricing Model


  Free tier available with no credit card required. Paid plans available for
  additional resources.
