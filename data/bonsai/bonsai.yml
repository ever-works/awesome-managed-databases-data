markdown: >-
  ## Overview


  Bonsai is a managed Elasticsearch service that provides search and analytics
  capabilities as a fully managed cloud database. Users do not need to operate
  their own Elasticsearch clusters.


  ## Features


  - Managed Elasticsearch clusters

  - 1 GB memory and 1 GB storage on the free tier

  - Fully managed cloud deployment

  - Search and analytics workloads


  ## Pricing


  A free tier is available with 1 GB memory and 1 GB storage. Paid plans scale
  beyond the free tier limits.
